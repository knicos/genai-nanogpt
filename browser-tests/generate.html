<html>
    <head>
        <title>TM Language Model</title>
        <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu/dist/tf-backend-webgpu.min.js"></script>
        <script
            type="module"
            src="../dist/ops/webgpu/index.js"
        ></script>
        <script
            type="module"
            src="/dist/main.js"
        ></script>
        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            #webcam {
                margin-bottom: 20px;
            }
            #prediction {
                font-size: 24px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <script type="module">
            import { TeachableLLM, waitForModel, selectBackend } from '/dist/main.js';

            await selectBackend('webgpu');

            const fileInput = document.getElementById('fileInput');
            const generateButton = document.getElementById('generateButton');
            const stepButton = document.getElementById('stepButton');
            const output = document.getElementById('output');
            let model = null;
            fileInput.addEventListener('change', async (event) => {
                const file = event.target.files[0];
                if (file) {
                    model = await TeachableLLM.loadModel(file);
                    await waitForModel(model);
                    model.enableProfiler = true;
                }
            });

            generateButton.addEventListener('click', async () => {
                if (!model) {
                    alert('Please load a model first.');
                    return;
                }
                const prompt = 'Once upon a time';
                console.log('Generating text for prompt:', prompt);
                const options = {
                    input: prompt,
                    maxLength: 128 * 4 * 2,
                    temperature: 0.7,
                    attentionScores: false,
                    topP: 0.8,
                };

                const resp = await model.responses.create(options, (chunk) => {
                    // intermediate chunk updates
                    output.innerText = '\n\nGenerated Text:\n' + (chunk.output || '');
                });

                output.innerText = '\n\nGenerated Text:\n' + (resp.output || '');
                console.log('Attention', options.attentionScores);
                model.getProfiler().printSummary();
            });

            stepButton.addEventListener('click', async () => {
                if (!model) {
                    alert('Please load a model first.');
                    return;
                }
                const prompt = 'Once upon a time';
                console.log('Step generating text for prompt:', prompt);
                const options = {
                    input: prompt,
                    maxLength: 32,
                    temperature: 0.7,
                    attentionScores: false,
                    topP: 0.8,
                };

                const resp = await model.responses.create(options, (chunk) => {
                    output.innerText = chunk.output || '';
                });

                console.log('Step Generated Text:', resp.output);
                output.innerText = resp.output || '';
                model.getProfiler().printSummary();
            });
        </script>
        <input
            type="file"
            id="fileInput"
            accept=".zip"
        />
        <button id="generateButton">Generate Text</button>
        <button id="stepButton">Step Generate</button>
        <div id="output"></div>
    </body>
</html>
