# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
    branches:
        include:
            - main
    tags:
        include:
            - '*'

#pool:
#    vmImage: ubuntu-latest
pool: Default

variables:
    NPM_CACHE_FOLDER: $(Pipeline.Workspace)/.npm

stages:
    - stage: Static
      condition: not(contains(variables['build.sourceBranch'], 'refs/tags/'))
      jobs:
          - job: ESLint
            displayName: ESLint
            steps:
                - script: |
                      npm ci
                      npm run lint
    - stage: Build
      dependsOn: Static
      jobs:
          - job: Ubuntu_x64
            displayName: Build Ubuntu X64
            steps:
                - task: UseNode@1
                  inputs:
                      version: '22.x'
                  displayName: 'Install Node.js'
                - script: |
                      npm ci
                      npm run build
                  displayName: 'Build'

    - stage: Test
      dependsOn: Build
      jobs:
          - job: Ubuntu_x64
            displayName: Test Ubuntu X64
            steps:
                - task: UseNode@1
                  inputs:
                      version: '22.x'
                  displayName: 'Install Node.js'
                - script: |
                      npm ci
                      CI=true npm run ci:test
                  displayName: 'Test'
                - task: PublishTestResults@2
                  displayName: Publish Test Results
                  condition: succeededOrFailed()
                  inputs:
                      testRunner: JUnit
                      testResultsFiles: '**/junit.xml'
                - task: PublishCodeCoverageResults@2
                  inputs:
                      summaryFileLocation: 'coverage/cobertura-coverage.xml'
                      pathToSources: 'lib'

    - stage: PublishProduction
      displayName: Publish
      condition: contains(variables['build.sourceBranch'], 'refs/tags/')
      jobs:
          - job: Ubuntu_x64
            displayName: Publish Package Job
            steps:
                - task: UseNode@1
                  inputs:
                      version: '22.x'
                  displayName: 'Install Node.js'
                - script: |
                      echo -e "\n//registry.npmjs.org/:_authToken=$(NPM_TOKEN)" >> ./.npmrc
                      npm ci
                      npm run build
                      npm version --git-tag-version=false ${BUILD_SOURCEBRANCHNAME}
                      npm publish --access public
